# Default student training preset. Overridable from the train.py CLI.
model_name: google/mt5-small
max_input_length: 512
max_target_length: 128
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
learning_rate: 3.0e-4
num_epochs: 3
per_device_train_batch: 4
per_device_eval_batch: 8
grad_accum: 4
warmup_ratio: 0.05
fp16: true
gradient_checkpointing: false
seed: 42
source_prefix: "özetle: "
